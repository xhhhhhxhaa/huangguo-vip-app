name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: 换官方 Gradle 下载源
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|gradle-8.3-all.zip|gradle-8.3-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: 换官方 Maven 源
        run: |
          sed -i '/maven.aliyun.com/d' android/build.gradle
          sed -i '/maven.aliyun.com/d' android/settings.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - run: flutter pub get

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || true
          echo "=========== 仓库根目录 ==========="
          ls -la
          echo "=========== 所有 build 目录 ==========="
          find . -path ./.git -prune -o -type d -name build -print || true
          echo "=========== 整个工作区的 apk ==========="
          find . -path ./.git -prune -o -type f -name "*.apk" -print | sort || true
          mkdir -p out
          find . -path ./.git -prune -o -type f -name "*.apk" -print -exec cp -v {} out/ \; || true
          echo "=========== out 目录 ==========="
          ls -lh out || true

      - name: 校验产物
        run: |
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::error::整个工作区都没有 apk，见上面『所有 build 目录』与 build-log"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huangguo-vip-apk
          path: out/*.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
